<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - NEXORA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/profile.css">
</head>
<body>

<div class="container-fluid py-4">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-lg-3 mb-4">
            <div class="sidebar">

                <div class="sidebar-header">
                    AKUN SAYA
                </div>

                <ul class="sidebar-menu">
                    <li><a href="profile.html">Informasi Account</a></li>
                    <li><a href="wallet.html" class="active">Wallet</a></li>
                    <li><a href="lacak.html">Lacak Pesanan</a></li>
                    <li><a href="ulasan.html">Ulasan Saya</a></li>
                    <li><a href="#">Kartu Saya</a></li>
                    <li><a href="#">Preferensi Email</a></li>
                    <li><a href="#">Wishlist</a></li>
                    <li><a href="#">Permohonan Penghapusan Akun</a></li>
                </ul>

            </div>
        </div>

        <!-- Content -->
        <div class="col-lg-9">

            <!-- Saldo -->
            <div class="card-box mb-4">

                <div class="card-header-custom">
                    <div>
                        <i class="bi bi-wallet2"></i>
                        Wallet Saya
                    </div>
                </div>

                <div class="wallet-card">
                    <h6>Saldo Wallet</h6>
                    <h1>Rp 0</h1>

                    <div class="wallet-actions">
                        <button class="btn-dark-custom">
                            Top Up
                        </button>

                        <button class="btn-outline-secondary">
                            Riwayat
                        </button>
                    </div>
                </div>

            </div>

            <!-- Riwayat -->
            <div class="card-box">

                <div class="card-header-custom">
                    <div>
                        Riwayat Transaksi
                    </div>
                </div>

                <div class="empty-address">
                    <i class="bi bi-receipt address-icon"></i>

                    <p>
                        Belum ada transaksi wallet.
                    </p>
                </div>

            </div>

        </div>

    </div>
</div>

<script src="../assets/js/profile.js"></script>

</body>
</html>
