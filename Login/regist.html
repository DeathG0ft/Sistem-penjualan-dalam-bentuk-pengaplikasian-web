<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA OFFICIAL STORE - REGISTER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="Black and White Modern Initial N Technology Logo.png" type="image/x-icon">
    <link rel="stylesheet" href="regist.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<a href="../index.html" class="home-btn">
    <i class="bi bi-house-door-fill"></i>
</a>

<div class="login-container">
    <div class="login-card">

        <div class="logo-area">
            <img src="../assets/foto/Black and White Modern Initial N Technology Logo.png" alt="NEXORA">
            <h1>NEXORA</h1>
            <p>Buat Akun Baru</p>
        </div>

        <form id="registerForm">

            <!-- Input Username -->
            <div class="input-box">
                <i class="bi bi-person-fill"></i>
                <input type="text" placeholder="Username" required>
            </div>

            <!-- Input Email -->
            <div class="input-box">
                <i class="bi bi-envelope"></i>
                <input type="email" placeholder="Email" required>
            </div>

            <!-- Input Password -->
            <div class="input-box">
                <i class="bi bi-lock"></i>
                <input type="password" placeholder="Password" required>
            </div>

            <!-- Input No HP -->
            <div class="input-box">
                <i class="bi bi-telephone"></i>
                <input type="tel" placeholder="Nomor HP (Contoh: 081234xxx)" required>
            </div>

            <!-- Input Alamat -->
            <div class="input-box textarea-box">
                <i class="bi bi-geo-alt"></i>
                <textarea placeholder="Alamat Lengkap" rows="3" required></textarea>
            </div>

            <!-- Syarat & Ketentuan -->
            <div class="options">
                <label>
                    <input type="checkbox" required>
                    Saya setuju dengan Syarat & Ketentuan
                </label>
            </div>

            <button type="submit" class="login-btn">
                REGISTER
            </button>

            <div class="register">
                Sudah punya akun?
                <a href="login.html">Login Sekarang</a>
            </div>

        </form>

    </div>
</div>

<script src="regist.js"></script>
</body>
</html>
