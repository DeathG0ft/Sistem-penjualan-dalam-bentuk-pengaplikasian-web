<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA OFFICIAL STORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="Black and White Modern Initial N Technology Logo.png" type="image/x-icon">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</head>
<body>
    
<body>

<a href="../index.html" class="home-btn">
    <i class="bi bi-house-door-fill"></i>
</a>

<div class="login-container">

    <div class="login-card">

        <div class="logo-area">
            <img src="../assets/foto/Black and White Modern Initial N Technology Logo.png" alt="NEXORA">
            <h1>NEXORA</h1>
            <p>Official Store</p>
        </div>

        <form id="loginForm">

            <div class="input-box">
                <i class="bi bi-envelope"></i>
                <input type="email" placeholder="Email" required>
            </div>

            <div class="input-box">
                <i class="bi bi-lock"></i>
                <input type="password" placeholder="Password" required>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                LOGIN
            </button>

            <div class="register">
                Belum punya akun?
                <a href="register.html">Daftar Sekarang</a>
            </div>

        </form>

    </div>

</div>

<script src="login.js"></script>

</body>
</body>
</html>
